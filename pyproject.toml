[project]
name = "india-bank-rates-mcp"
version = "0.1.0"
description = "MCP server for RBI repo rate and Indian bank fixed-deposit rates"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.3",
  "pandas>=2.2.0",
  "lxml>=5.2.0",
]

[project.scripts]
india-bank-rates-mcp = "india_bank_rates_mcp.server:main"
